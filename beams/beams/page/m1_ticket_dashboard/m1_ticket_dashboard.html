{% for card in card_data %}
<div class="card" id="{{card.id}}">
    <div style="padding:20px;border-radius:10px; background-color: {{card.bg_color}}; color:{{card.color}};">
        <div style="font-size:14px;">{{card.title}}</div>
        <div style="font-size:32px;font-weight:bold;">{{card.value}}</div>
    </div>
</div>
{% endfor %}
