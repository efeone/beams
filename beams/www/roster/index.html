{% extends "templates/base.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1 Roster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.min.js"></script>
</head>

<body>
    <!-- Page Wrapper -->
    <div class="page-wrapper">

        <!-- Page Head -->
        <div class="page-head">
            <div class="page-head-left">
                <div class="page-title">M1 Roster</div>
            </div>
            <div class="page-head-right">
                <div class="view-toggle">
                    <button id="btn-weekly" class="btn active" onclick="set_view('weekly')">Weekly</button>
                    <button id="btn-monthly" class="btn" onclick="set_view('monthly')">Monthly</button>
                </div>
                <button class="btn btn-default btn-sm" onclick="navigate(-1)">&#8592; Previous</button>
                <button class="btn btn-default btn-sm today-btn" onclick="go_to_today()">Today</button>
                <button class="btn btn-default btn-sm" onclick="navigate(1)">Next &#8594;</button>
            </div>
        </div>

        <!-- Page Body -->
        <div class="page-body">
            <div class="frappe-card">

                <!-- Roster Toolbar -->
                <div class="roster-toolbar">
                    <div class="toolbar-left">
                        <span class="indicator" id="view-indicator" style="background:#2490ef;"></span>
                        <span class="date-range-label" id="date-range-label"></span>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">

                        <label style="font-size:12px;color:var(--text-muted);">
                            Department
                        </label>

                        <select id="department-filter" class="frappe-input" style="width:180px;"
                            onchange="reload_employees_by_department()">
                            <option value="">All Departments</option>
                        </select>

                        <span style="font-size:11px;color:var(--text-muted);" id="summary-label"></span>

                    </div>
                </div>

                <!-- Table -->
                <div class="roster-table-wrap">
                    <table class="roster-table" id="roster-table"></table>
                </div>

                <!-- Legend -->
                <div class="legend-bar" id="legend-bar"></div>

            </div>
        </div>
    </div><!-- /page-wrapper -->

    <!-- Modal -->
    <div class="modal-backdrop" id="modal-backdrop" onclick="handle_backdrop_click(event)">
        <div class="modal-dialog">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modal-title">Assign Employee</div>
                    <div class="modal-subtitle" id="modal-subtitle"></div>
                </div>
                <button class="modal-close" onclick="close_modal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <input class="frappe-input" id="emp-search" type="text" placeholder="Search employee..."
                    oninput="filter_employees()" style="margin-bottom:10px;">
                <div id="emp-list"></div>
                <div class="assigned-section" id="assigned-section">
                    <div class="section-label">Assigned</div>
                    <div id="assigned-list"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
{%- endblock -%}
